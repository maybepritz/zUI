[package]
name = "z-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "time", "macros", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
anyhow = "1"
base64 = "0.23.1"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
self_update = { version = "1.3.0", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate", "reqwest", "github"] }
