[package]
name = "z-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
anyhow = "1"
base64 = "0.23.1"
sha2 = "0.10.9"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
self_update = { version = "1.3.0", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate", "reqwest", "github"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }
