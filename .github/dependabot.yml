# Раз в неделю: обновления GitHub Actions и зависимостей Rust.
# Зависимости Rust приходят одним PR на группу, чтобы не засыпать репозиторий.
# PR идут в next: обновления попадают в выпуск вместе с остальной работой.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
