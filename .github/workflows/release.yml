# Releases a new version when the version in Cargo.toml changes on main.
# If the tag v<version> does not exist yet, it builds the Windows ZIP, creates the tag
# and attaches the ZIP to a draft release that you publish by hand.
# The release notes are taken from the matching section of CHANGELOG.md.
name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  # For build provenance: GitHub signs a statement that these files came from this run.
  id-token: write
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      # Other edits to Cargo.toml keep the same version, so an existing tag means nothing to do.
      - id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists, nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p zUI --bin zUI

      # Same archive name and contents as docs/releases.md; the updater looks for it.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath @('target/x86_64-pc-windows-msvc/release/zUI.exe', 'LICENSE') -DestinationPath dist/zUI-x86_64-pc-windows-msvc.zip -Force

      # The section "## <version> · <name>" of CHANGELOG.md, without its heading.
      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\b[^\n]*\n(.*?)(?=^## |\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          $match.Groups[1].Value.Trim() | Set-Content dist/release-notes.md -Encoding utf8
          $codename = (Get-Content crates/app/release-name.txt -Raw).Trim()
          "title=zUI $version $codename" >> $env:GITHUB_OUTPUT

      # Anyone can check a download against these and against the attestation below.
      - name: Checksums
        shell: pwsh
        run: |
          $files = @('target/x86_64-pc-windows-msvc/release/zUI.exe', 'dist/zUI-x86_64-pc-windows-msvc.zip')
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $f).Hash.ToLower()
            '| `{0}` | `{1}` |' -f (Split-Path $f -Leaf), $hash
          }
          $section = @(
            '',
            '### Проверка файлов',
            '',
            'Файлы собраны GitHub Actions из этого тега. SHA-256:',
            '',
            '| Файл | SHA-256 |',
            '| --- | --- |'
          ) + $lines + @(
            '',
            'Подтверждение сборки: `gh attestation verify <файл> --repo ${{ github.repository }}`.',
            'Подробнее — в разделе «Антивирус и проверка подлинности» README.'
          )
          Add-Content dist/release-notes.md -Value $section -Encoding utf8

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/x86_64-pc-windows-msvc/release/zUI.exe
            dist/zUI-x86_64-pc-windows-msvc.zip

      # Tag only after a successful build, so a failed run can simply be retried.
      - name: Tag
        run: |
          git tag ${{ needs.version.outputs.tag }}
          git push origin ${{ needs.version.outputs.tag }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: dist/release-notes.md
          draft: true
          files: dist/zUI-x86_64-pc-windows-msvc.zip
